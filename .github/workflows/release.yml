name: Release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run registry:build
      - uses: actions/upload-artifact@v4
        with:
          name: creaseui-${{ github.ref_name }}
          path: |
            dist
            .registry
            registry.json
            compatibility.json
