name: Release verification

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic release checks
        run: npm run check

      - name: Run browser and accessibility checks
        run: npx playwright test

      - name: Build registry
        run: npm run registry:build

      - name: Verify a clean registry consumer and every icon adapter
        run: npm run test:registry

      - name: Upload release proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: creaseui-release-proof-${{ github.ref_name }}
          path: |
            dist/
            .registry/
            playwright-report/
            test-results/
            registry.json
            compatibility.json
            docs/component-parity.json
            docs/upstream-shadcn.json
          retention-days: 30
