name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated artifacts, parity, source, types, tests, and build
        run: npm run check

      - name: Validate registry
        run: npm run registry:build

      - name: Verify packed @creaseui/lint in fresh consumers
        run: npm run lint:consumers

      - name: Lint, typecheck and build strict apps on real registry installs
        run: npm run test:strict-consumers

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered audit fixtures
        run: npm run test:lint-audit

      - name: Theme grammar browser oracle
        run: node scripts/run-unit-tests.mjs test/theme-grammar-browser.test.ts

      - name: Build site
        run: npm run build

      - name: Check all renderer sites, preset matrix and overlay contracts
        run: npx playwright test --config playwright.sites.config.ts

      - name: Upload renderer site report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: renderer-sites-report
          path: |
            playwright-report/sites
            test-results/sites
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Print process limits
        run: |
          ulimit -Sn; ulimit -Hn; cat /proc/self/limits; df -h /tmp /dev/shm; nproc; free -m

      - name: Run browser and accessibility tests
        run: npx playwright test e2e/copied-doc-programs.spec.ts --project=chromium
        env:
          PLAYWRIGHT_WORKERS: 2

      - name: Upload e2e failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/playwright
          retention-days: 7

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Build site
        run: npm run build

      - name: Run cross-browser critical interactions
        run: npm run test:cross-browser

      - name: Upload cross-browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-report
          path: |
            playwright-report/cross-browser
            test-results/cross-browser
          retention-days: 14
