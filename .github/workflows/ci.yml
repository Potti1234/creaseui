name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated artifacts, parity, source, types, tests, and build
        run: npm run check

      - name: Validate registry
        run: npm run registry:build

      - name: Verify packed @creaseui/lint in fresh consumers
        run: npm run lint:consumers

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Check all renderer sites, preset matrix and overlay contracts
        run: npx playwright test --config playwright.sites.config.ts

      - name: Upload renderer site report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: renderer-sites-report
          path: |
            playwright-report/sites
            test-results/sites
          retention-days: 14

      - name: Run browser and accessibility tests
        run: npm run test:e2e
