<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Incomplete coverage</title>
    <style>
      #gradient-text { background-image: linear-gradient(#fff, #eee); }
      #faint { color: #cccccc; }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Incomplete coverage</h1>
      <p id="gradient-text">Text over a gradient</p>
      <p id="faint">Faint copy</p>
      <iframe
        id="embed"
        title="Embedded content"
        srcdoc="<p>frame</p>"
      ></iframe>
    </main>
  </body>
</html>
