<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spatial focus behavior · CreaseUI</title>
    <style>
      :root { font: 16px/1.6 system-ui, sans-serif; color: #17362e; background: #f5f6f1; }
      body { margin: 0; }
      main { max-width: 640px; margin: 64px auto; padding: 24px; }
      .eyebrow { color: #52796a; font-size: 12px; font-weight: 700; letter-spacing: .14em; }
      h1 { margin: 12px 0; font-size: 44px; line-height: 1.15; letter-spacing: -.04em; }
      #instructions { max-width: 580px; color: #53665e; }
      .board { position: relative; width: 620px; height: 370px; margin-top: 32px; border: 1px solid #cbd8ca; border-radius: 20px; background-color: #eaf0e5; background-image: radial-gradient(#bdcbb8 1px, transparent 1px); background-size: 16px 16px; }
      .card { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; padding: 20px; border: 1px solid #b6c6b8; border-radius: 12px; color: #17362e; background: #fffef8; box-shadow: 0 3px 0 #d4dfce; font: inherit; text-align: left; cursor: pointer; }
      .card-label { font-weight: 700; font-size: 20px; }
      .card-detail { font-size: 12px; color: #5d7165; }
      .card:focus { outline: 3px solid #146d54; outline-offset: 5px; background: #e0f3df; }
      .card:disabled { color: #778174; background: #e1e6dc; box-shadow: none; cursor: not-allowed; }
      .card-A { left: 20px; top: 20px; width: 160px; height: 110px; }
      .card-B { left: 425px; top: 220px; width: 150px; height: 110px; }
      .card-C { left: 400px; top: 30px; width: 180px; height: 90px; }
      .card-D { left: 240px; top: 45px; width: 125px; height: 90px; padding: 14px; }
      .card-E { left: 40px; top: 240px; width: 210px; height: 90px; }
      .caption { font-size: 13px; color: #53665e; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
