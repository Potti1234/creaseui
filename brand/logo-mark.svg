<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- crease/ui mark: a sheet with its top-right corner folded in along the
       diagonal from (64,0) to (128,64). The flap is the exact mirror of the
       removed corner across that crease line. Ink-on-paper colorway. -->
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="128" height="128" rx="20" />
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- sheet minus the folded-away corner -->
    <path d="M0 0 H64 L128 64 V128 H0 Z" fill="oklch(0.155 0.005 270)" />
    <!-- the folded flap, one shade lighter -->
    <path d="M64 0 L128 64 L64 64 Z" fill="oklch(0.42 0.005 270)" />
    <!-- crease highlight along the fold -->
    <path d="M64 0 L128 64" stroke="oklch(0.985 0.002 95)" stroke-opacity="0.25" stroke-width="2.5" />
  </g>
</svg>
